name: PricePilot AI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Automated Tests & Code Verification
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "App directory:"
          ls -la app || true
          echo "Tests directory:"
          ls -la tests || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ReportLab
        run: |
          python -c "import reportlab; print('ReportLab installed successfully')"

      - name: Run Flake8
        run: |
          flake8 . --exclude=.git,venv,__pycache__ --max-line-length=120

      - name: Run tests
        run: |
          python -m pytest -v

  docker:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t pricepilot-ai:latest .